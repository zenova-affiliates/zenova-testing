<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Hub — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-base:     #0f1419;
      --bg-surface:  #1a1f2e;
      --bg-card:     #1a1f2e;
      --bg-input:    #1a1f2e;
      --border:      #2d3748;
      --border-dark: #374151;
      --text-primary:  #f1f5f9;
      --text-secondary:#cbd5e1;
      --text-muted:    #94a3b8;
      --accent:      #00d9ff;
      --accent-hover:#00b8d9;
      --danger:      #ef4444;
      --success:     #22c55e;
      --warning:     #f59e0b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
    body{background:var(--bg-base);color:var(--text-primary);font-family:'Inter',sans-serif;min-height:100vh;}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-track{background:var(--bg-surface);}
    ::-webkit-scrollbar-thumb{background:var(--border-dark);border-radius:3px;}

    /* ── Gate ── */
    #gate{
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(ellipse at 60% 40%, rgba(0,217,255,0.07) 0%, transparent 60%);
    }
    .gate-box{
      width:100%;max-width:420px;
      background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;
      padding:40px 36px;box-shadow:0 32px 64px rgba(0,0,0,0.4);
    }
    .gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center;}
    .gate-logo-icon{
      width:44px;height:44px;
      background:linear-gradient(135deg,#00d9ff,#ffa500);
      border-radius:10px;display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:20px;font-family:'Poppins',sans-serif;
    }
    .gate-logo-text{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--text-primary);}
    .gate-title{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;text-align:center;margin-bottom:8px;}
    .gate-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:28px;}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
    .field input{
      width:100%;padding:12px 16px;
      background:var(--bg-base);border:1px solid var(--border);border-radius:8px;
      color:var(--text-primary);font-size:14px;font-family:'Inter',sans-serif;
      outline:none;transition:border-color .2s;
    }
    .field input:focus{border-color:var(--accent);}
    .field input::placeholder{color:var(--text-muted);}
    .btn-login{
      width:100%;padding:13px;border:none;border-radius:8px;
      background:var(--accent);color:#000;font-family:'Inter',sans-serif;
      font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;
      transition:background .2s,transform .1s;margin-top:4px;
    }
    .btn-login:hover{background:var(--accent-hover);}
    .btn-login:active{transform:scale(0.98);}
    .login-err{color:var(--danger);font-size:12px;margin-top:12px;text-align:center;display:none;}

    /* ── Dashboard ── */
    #dashboard{display:none;}

    /* Topbar */
    .topbar{
      background:var(--bg-surface);border-bottom:1px solid var(--border);
      padding:0 24px;height:60px;display:flex;align-items:center;
      justify-content:space-between;position:sticky;top:0;z-index:50;
    }
    .topbar-left{display:flex;align-items:center;gap:12px;}
    .topbar-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#00d9ff,#ffa500);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:'Poppins',sans-serif;}
    .topbar-title{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;}
    .topbar-badge{background:rgba(0,217,255,.15);color:var(--accent);font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.5px;}
    .btn-logout{
      padding:7px 16px;border:1px solid var(--border);border-radius:8px;
      background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;
      cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;
    }
    .btn-logout:hover{border-color:var(--danger);color:var(--danger);}

    /* Main layout */
    .dash-body{max-width:900px;margin:0 auto;padding:32px 20px;}

    /* Tabs */
    .tabs{display:flex;gap:4px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:28px;}
    .tab{
      flex:1;padding:10px;border:none;border-radius:8px;
      background:transparent;color:var(--text-muted);
      font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
      cursor:pointer;transition:all .2s;
    }
    .tab.active{background:var(--accent);color:#000;}
    .tab:not(.active):hover{background:var(--border);color:var(--text-primary);}

    /* Form card */
    .form-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:28px;}
    .form-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-bottom:24px;color:var(--text-primary);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
    .form-field{margin-bottom:0;}
    .form-field.full{grid-column:1/-1;}
    .form-field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;}
    .form-field input,
    .form-field select,
    .form-field textarea{
      width:100%;padding:11px 14px;
      background:var(--bg-base);border:1px solid var(--border);border-radius:8px;
      color:var(--text-primary);font-family:'Inter',sans-serif;font-size:13px;
      outline:none;transition:border-color .2s;
    }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus{border-color:var(--accent);}
    .form-field input::placeholder,
    .form-field textarea::placeholder{color:var(--text-muted);}
    .form-field select option{background:var(--bg-surface);}
    .form-field textarea{resize:vertical;min-height:80px;}
    .checkbox-wrapper{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-base);border:1px solid var(--border);border-radius:8px;cursor:pointer;}
    .checkbox-wrapper input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
    .checkbox-wrapper label{margin:0;text-transform:none;letter-spacing:normal;color:var(--text-secondary);font-size:13px;cursor:pointer;}
    .thumb-fields{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
    .btn-add-thumb{
      margin-top:8px;padding:8px 16px;border:1px dashed var(--border-dark);border-radius:6px;
      background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;
      cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;width:100%;text-align:center;
    }
    .btn-add-thumb:hover{border-color:var(--accent);color:var(--accent);}
    .form-actions{display:flex;gap:12px;margin-top:24px;}
    .btn-submit{
      flex:1;padding:13px;border:none;border-radius:8px;
      background:var(--accent);color:#000;font-family:'Inter',sans-serif;
      font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;
    }
    .btn-submit:hover{background:var(--accent-hover);}
    .btn-cancel{
      padding:13px 20px;border:1px solid var(--border);border-radius:8px;
      background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;
      cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;display:none;
    }
    .btn-cancel:hover{border-color:var(--text-muted);color:var(--text-primary);}
    .form-msg{
      text-align:center;margin-top:14px;font-size:12px;font-weight:600;
      color:var(--accent);display:none;padding:10px;border-radius:8px;
      background:rgba(0,217,255,.08);border:1px solid rgba(0,217,255,.2);
    }

    /* Product list */
    .list-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:28px;}
    .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .list-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;}
    .list-count{background:rgba(0,217,255,.12);color:var(--accent);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}
    .product-list{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px;}
    .product-item{
      background:var(--bg-base);border:1px solid var(--border);border-radius:10px;
      padding:14px 16px;display:flex;align-items:center;gap:14px;
      transition:border-color .2s;
    }
    .product-item:hover{border-color:rgba(0,217,255,.3);}
    .product-item-img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex-shrink:0;background:var(--bg-surface);}
    .product-item-info{flex:1;min-width:0;}
    .product-item-name{font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .product-item-meta{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;align-items:center;}
    .product-item-cat{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;}
    .product-item-price{font-size:11px;color:var(--text-muted);}
    .product-item-premium{font-size:11px;color:var(--success);font-weight:600;}
    .product-item-btns{display:flex;gap:8px;flex-shrink:0;}
    .btn-edit{
      padding:7px 14px;border:1px solid var(--border);border-radius:6px;
      background:transparent;color:var(--text-secondary);font-size:11px;font-weight:600;
      cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;
    }
    .btn-edit:hover{border-color:var(--accent);color:var(--accent);}
    .btn-del{
      padding:7px 14px;border:1px solid var(--border);border-radius:6px;
      background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;
      cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;
    }
    .btn-del:hover{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,.07);}
    .list-empty{text-align:center;padding:48px 0;color:var(--text-muted);font-size:14px;}
    .list-empty span{font-size:36px;display:block;margin-bottom:12px;}
  </style>
</head>
<body>

<!-- ── Gate ── -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">
      <div class="gate-logo-icon">T</div>
      <span class="gate-logo-text">Tech Hub</span>
    </div>
    <h2 class="gate-title">Admin Access</h2>
    <p class="gate-sub">Sign in to manage your products</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="admin-email" placeholder="admin@email.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="admin-password" placeholder="Password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo-icon">T</div>
      <span class="topbar-title">Tech Hub</span>
      <span class="topbar-badge">ADMIN</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>

  <div class="dash-body">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('add')">+ Add Product</button>
      <button class="tab" onclick="switchTab('list')">Manage Products</button>
    </div>

    <!-- Add / Edit Tab -->
    <div id="tab-add">
      <div class="form-card">
        <div class="form-title" id="form-title">Add New Product</div>
        <div class="form-grid">
          <div class="form-field">
            <label>Product Name *</label>
            <input type="text" id="ap-name" placeholder="e.g. Sony WH-1000XM5">
          </div>
          <div class="form-field">
            <label>Category *</label>
            <select id="ap-category">
              <option value="Laptops">💻 Laptops</option>
              <option value="Smartphones">📱 Smartphones</option>
              <option value="Audio">🎧 Audio</option>
              <option value="Gaming">🎮 Gaming</option>
              <option value="Wearables">⌚ Wearables</option>
              <option value="Accessories">🔌 Accessories</option>
              <option value="Displays">🖥️ Displays</option>
              <option value="Cameras">📷 Cameras</option>
              <option value="Storage">💾 Storage</option>
              <option value="Peripherals">⌨️ Peripherals</option>
            </select>
          </div>
          <div class="form-field">
            <label>Price (USD) *</label>
            <input type="number" id="ap-price" placeholder="e.g. 199.99" step="0.01">
          </div>
          <div class="form-field">
            <label>Badge Label</label>
            <select id="ap-badge">
              <option value="">No Badge</option>
              <option value="Best Seller">🏆 Best Seller</option>
              <option value="New">✨ New</option>
              <option value="Premium">💎 Premium</option>
              <option value="Hot Deal">🔥 Hot Deal</option>
              <option value="Limited">⚡ Limited</option>
            </select>
          </div>
          <div class="form-field">
            <label>Rating (1–5)</label>
            <input type="number" id="ap-rating" placeholder="e.g. 4.8" min="1" max="5" step="0.1">
          </div>
          <div class="form-field">
            <label>Reviews Count</label>
            <input type="number" id="ap-reviews" placeholder="e.g. 245">
          </div>
          <div class="form-field full">
            <label>Buy Link</label>
            <input type="url" id="ap-link" placeholder="https://...">
          </div>
          <div class="form-field full">
            <label>Short Description</label>
            <input type="text" id="ap-short" placeholder="One-line product summary">
          </div>
          <div class="form-field full">
            <label>Full Description</label>
            <textarea id="ap-full" placeholder="Detailed product description..."></textarea>
          </div>
          <div class="form-field full">
            <label>Main Image URL *</label>
            <input type="url" id="ap-img" placeholder="https://...">
            <div class="thumb-fields" id="thumb-fields"></div>
            <button class="btn-add-thumb" onclick="addThumb()">+ Add extra image</button>
          </div>
          <div class="form-field full">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="ap-premium">
              <label for="ap-premium">✨ Show in Premium Products Carousel (Hero Section)</label>
            </div>
          </div>
        </div>
        <input type="hidden" id="ap-edit-id">
        <div class="form-actions">
          <button class="btn-cancel" id="btn-cancel" onclick="cancelEdit()">Cancel</button>
          <button class="btn-submit" id="btn-submit" onclick="submitProduct()">Add Product</button>
        </div>
        <div class="form-msg" id="form-msg"></div>
      </div>
    </div>

    <!-- List Tab -->
    <div id="tab-list" style="display:none;">
      <div class="list-card">
        <div class="list-header">
          <span class="list-title">All Products</span>
          <span class="list-count" id="list-count">0 items</span>
        </div>
        <div class="product-list" id="product-list"></div>
        <div class="list-empty" id="list-empty">
          <span>📦</span>No products yet. Add your first one!
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp }                         from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged,
           signInWithEmailAndPassword, signOut }   from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot,
           addDoc, updateDoc, deleteDoc, doc,
           query, orderBy }                       from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──
  const firebaseConfig = {
    apiKey: "AIzaSyD1H6TClrILVXaPX-7FidvVZmpJLsvumPk",
    authDomain: "zenova-store.firebaseapp.com",
    projectId: "zenova-store",
    storageBucket: "zenova-store.firebasestorage.app",
    messagingSenderId: "1086423258032",
    appId: "1:1086423258032:web:5e39a8196fc3763188fc75",
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const col  = collection(db, 'products');

  window._products = [];
  let _unsubscribe = null;

  onAuthStateChanged(auth, user => {
    document.getElementById('gate').style.display      = user ? 'none'  : 'flex';
    document.getElementById('dashboard').style.display = user ? 'block' : 'none';
    if (user) {
      if (_unsubscribe) _unsubscribe();
      const q = query(col, orderBy('createdAt','desc'));
      _unsubscribe = onSnapshot(q, snap => {
        window._products = [];
        snap.forEach(d => window._products.push({ id:d.id, ...d.data() }));
        renderList();
        updateCount();
      });
    }
  });

  window.doLogin = function() {
    const email = document.getElementById('admin-email').value.trim();
    const pass  = document.getElementById('admin-password').value;
    const err   = document.getElementById('login-err');
    err.style.display = 'none';
    signInWithEmailAndPassword(auth, email, pass)
      .then(() => {
        document.getElementById('admin-email').value    = '';
        document.getElementById('admin-password').value = '';
      })
      .catch(e => {
        const msgs = {
          'auth/invalid-email':'Invalid email.','auth/user-not-found':'No account found.',
          'auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Invalid email or password.',
          'auth/too-many-requests':'Too many attempts. Try later.'
        };
        err.textContent = msgs[e.code] || 'Login failed.';
        err.style.display = 'block';
      });
  };

  window.doLogout = () => signOut(auth);

  window.submitProduct = async function() {
    const name     = document.getElementById('ap-name').value.trim();
    const price    = parseFloat(document.getElementById('ap-price').value);
    const category = document.getElementById('ap-category').value;
    const badge    = document.getElementById('ap-badge').value;
    const rating   = parseFloat(document.getElementById('ap-rating').value) || 0;
    const reviews  = parseInt(document.getElementById('ap-reviews').value)  || 0;
    const link     = document.getElementById('ap-link').value.trim();
    const shortDesc= document.getElementById('ap-short').value.trim();
    const fullDesc = document.getElementById('ap-full').value.trim();
    const mainImg  = document.getElementById('ap-img').value.trim();
    const isPremium= document.getElementById('ap-premium').checked;
    const editId   = document.getElementById('ap-edit-id').value;
    if (!name || !mainImg || !price) { alert('Name, Image URL, and Price are required.'); return; }
    const extraImgs = Array.from(document.querySelectorAll('.thumb-input')).map(i=>i.value.trim()).filter(Boolean);
    const data = { name, price, category, badge, rating, reviews, link, shortDesc, fullDesc, mainImg, extraImgs, isPremium, createdAt:Date.now() };
    try {
      if (editId) {
        await updateDoc(doc(db,'products',editId), data);
        showMsg('✓ Product updated!');
      } else {
        await addDoc(col, data);
        showMsg('✓ Product added!');
      }
      clearForm();
    } catch(e) { console.error(e); alert('Could not save.'); }
  };

  window.editProduct = function(id) {
    const p = window._products.find(x => x.id===id);
    if (!p) return;
    switchTab('add');
    document.getElementById('ap-name').value     = p.name      || '';
    document.getElementById('ap-price').value    = p.price     || '';
    document.getElementById('ap-category').value = p.category  || 'Audio';
    document.getElementById('ap-badge').value    = p.badge     || '';
    document.getElementById('ap-rating').value   = p.rating    || '';
    document.getElementById('ap-reviews').value  = p.reviews   || '';
    document.getElementById('ap-link').value     = p.link      || '';
    document.getElementById('ap-short').value    = p.shortDesc || '';
    document.getElementById('ap-full').value     = p.fullDesc  || '';
    document.getElementById('ap-img').value      = p.mainImg   || '';
    document.getElementById('ap-premium').checked= p.isPremium  || false;
    document.getElementById('ap-edit-id').value  = id;
    document.getElementById('form-title').textContent = 'Edit Product';
    document.getElementById('btn-submit').textContent = 'Save Changes';
    document.getElementById('btn-cancel').style.display = 'block';
    const tc = document.getElementById('thumb-fields'); tc.innerHTML = '';
    (p.extraImgs||[]).forEach(src => { addThumb(src); });
  };

  window.deleteProduct = async function(id) {
    if (!confirm('Delete this product permanently?')) return;
    try { await deleteDoc(doc(db,'products',id)); showMsg('Product deleted.'); }
    catch(e) { alert('Delete failed.'); }
  };

  function renderList() {
    const list  = document.getElementById('product-list');
    const empty = document.getElementById('list-empty');
    list.innerHTML = '';
    if (!window._products.length) { empty.style.display='block'; return; }
    empty.style.display = 'none';
    window._products.forEach(p => {
      const item = document.createElement('div');
      item.className = 'product-item';
      item.innerHTML = `
        <img class="product-item-img" src="${p.mainImg}" onerror="this.style.background='var(--bg-surface)';this.src='';">
        <div class="product-item-info">
          <div class="product-item-name">${p.name}</div>
          <div class="product-item-meta">
            <span class="product-item-cat">${p.category}</span>
            <span class="product-item-price">$${Number(p.price||0).toFixed(2)}</span>
            ${p.badge ? `<span style="font-size:11px;color:var(--warning);">${p.badge}</span>` : ''}
            ${p.isPremium ? `<span class="product-item-premium">✨ Premium</span>` : ''}
          </div>
        </div>
        <div class="product-item-btns">
          <button class="btn-edit" onclick="editProduct('${p.id}')">Edit</button>
          <button class="btn-del"  onclick="deleteProduct('${p.id}')">Delete</button>
        </div>`;
      list.appendChild(item);
    });
  }

  function updateCount() {
    document.getElementById('list-count').textContent = window._products.length + ' items';
  }
</script>

<script>
  function switchTab(tab) {
    const tabs = document.querySelectorAll('.tab');
    document.getElementById('tab-add').style.display  = tab==='add'  ? 'block' : 'none';
    document.getElementById('tab-list').style.display = tab==='list' ? 'block' : 'none';
    tabs[0].classList.toggle('active', tab==='add');
    tabs[1].classList.toggle('active', tab==='list');
    if (tab==='add') clearForm();
  }

  function clearForm() {
    ['ap-name','ap-price','ap-link','ap-short','ap-full','ap-img','ap-rating','ap-reviews'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value='';
    });
    document.getElementById('ap-badge').value    = '';
    document.getElementById('ap-category').value = 'Laptops';
    document.getElementById('ap-premium').checked= false;
    document.getElementById('ap-edit-id').value  = '';
    document.getElementById('thumb-fields').innerHTML = '';
    document.getElementById('form-title').textContent = 'Add New Product';
    document.getElementById('btn-submit').textContent = 'Add Product';
    document.getElementById('btn-cancel').style.display = 'none';
    document.getElementById('form-msg').style.display   = 'none';
  }

  function cancelEdit() { clearForm(); }

  function addThumb(val) {
    const c = document.getElementById('thumb-fields');
    if (c.children.length >= 3) return;
    const inp = document.createElement('input');
    inp.type = 'url'; inp.className = 'thumb-input';
    inp.placeholder = 'Extra image URL ' + (c.children.length+2);
    inp.value = val || '';
    inp.style.cssText = 'width:100%;padding:11px 14px;background:var(--bg-base);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:13px;outline:none;margin-top:0;';
    inp.addEventListener('focus', () => inp.style.borderColor='var(--accent)');
    inp.addEventListener('blur',  () => inp.style.borderColor='var(--border)');
    c.appendChild(inp);
  }

  function showMsg(text) {
    const m = document.getElementById('form-msg');
    m.textContent = text; m.style.display='block';
    setTimeout(()=>m.style.display='none', 3000);
  }

  // Enter key on login
  document.addEventListener('keydown', e => {
    if (e.key==='Enter') {
      const gate = document.getElementById('gate');
      if (gate.style.display !== 'none') doLogin();
    }
  });
</script>
</body>
</html>
